[project]
name = "fast-api-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.116.1",
	"httpx>=0.28.1",
	"pydantic[email]>=2.11.7",
	"pydantic-settings>=2.10.1",
	"python-dotenv>=1.2.2",
	"slowapi>=0.1.9",
	"uvicorn>=0.35.0",
	"python-multipart>=0.0.31",
	"pre-commit>=4.3.0",
	"langchain[anthropic,openai]>=0.3.27",
	"langfuse>=3.10.0",
	"inngest>=0.5.6",
	"redis>=6.4.0",
	"pyjwt>=2.10.1",
	"cryptography>=46.0.7",
	"langgraph>=1.2.0",
	"langchain-google-genai>=4.2.1",
	"slack-sdk>=3.41.0",
	"google-auth>=2.36.0",
	"google-auth-httplib2>=0.2.0",
	"google-api-python-client>=2.158.0",
	"markdown-it-py>=3.0",
	"python-toon>=0.1.3",
	"presidio-analyzer>=2.2.362",
	"presidio-anonymizer>=2.2.362",
	"spacy>=3.8.11,<3.9.0",
	"en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl#sha256=293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63",
	"html2text>=2025.4.15",
	"langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = ["pyright>=1.1.404", "ruff>=0.12.10"]

[tool.ruff]
exclude = [".venv", "migrations"]
lint.ignore = [
	"W191", # Ignore indentation with tabs.
	"D206", # Ignore indentation with tabs in docstrings.
	"D203", # Incompatible with D211; we prefer no blank line before class
	"D213", # Incompatible with D212; we prefer summary on first line
	"COM812", # Conflicts with formatter
]
lint.extend-select = [
	"D",   # Docstring rules
	"F",   # Pyflakes rules
	"W",   # PyCodeStyle warnings
	"E",   # PyCodeStyle errors
	"I",   # Sort imports properly
	"UP",  # Warn if certain things can changed due to newer Python versions
	"C4",  # Catch incorrect use of comprehensions, dict, list, etc
	"FA",  # Enforce from __future__ import annotations
	"ISC", # Good use of string concatenation
	"ICN", # Use common import conventions
	"RET", # Good return practices
	"SIM", # Common simplification rules
	"TID", # Some good import practices
	"TC",  # Enforce importing certain types in a TYPE_CHECKING block
	"PTH", # Use pathlib instead of os.path
	"TD",  # Be diligent with TODO comments
	"COM", # enforce trailing comma rules
	"DTZ", # require strict timezone manipulation with datetime
	"FBT", # detect boolean traps
	"N",   # enforce naming conventions, e.g. ClassName vs function_name
]

[tool.ruff.format]
indent-style = "tab"

[tool.pyright]
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"
