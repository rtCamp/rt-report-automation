services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '8000:8000'
        volumes:
            - ./app:/app/app
        command: uv run -m app.main

    redis:
        image: redis:latest
        container_name: redis-token-store
        restart: unless-stopped

        # Security configurations
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD}
            --appendonly yes
            --appendfsync everysec
            --save 900 1
            --save 300 10
            --maxmemory 512mb
            --maxmemory-policy allkeys-lru
            --tcp-keepalive 300
            --timeout 0
            --tcp-backlog 511
            --bind 0.0.0.0
            --protected-mode yes
            --port 6379

        # Port mapping (restricted to localhost)
        ports:
            - '6379:6379'

        # Health check (with auth)
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

        # Security options
        security_opt:
            - no-new-privileges:true

        # Data persistence (ensure correct permissions for UID 999)
        volumes:
            - redis_data:/data
volumes:
    redis_data:
        driver: local
